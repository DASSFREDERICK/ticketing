<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Helix Ticketing</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--navy:#10203f;--bg:#fafbfd;--line:#e4e9f2;--ink:#111c33;--mute:#6b7690;--b:#2563eb;--b2:#1d4ed8;--bl:#e8f0ff;--red:#e5484d}
*{box-sizing:border-box}
body{margin:0;font:14px/1.5 Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink)}
button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}
.i{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hide{display:none!important}.sp{flex:1}
.bt{border:1px solid var(--line);background:#fff;padding:9px 16px;border-radius:8px;font-weight:500;transition:.15s}
.bt:hover{background:#f1f5fb}.bt.p{background:var(--ink);border-color:var(--ink);color:#fff}.bt.p:hover{background:var(--b);border-color:var(--b)}
.bt.r{background:#b4454b;border-color:#b4454b;color:#fff}.bt.r:hover{filter:brightness(1.08)}
.bt.s{padding:4px 16px;color:var(--b);border-color:#cfdcf7}.bt:disabled{opacity:.6;cursor:wait}
.ib{width:34px;height:34px;padding:0;display:grid;place-items:center;border:0;background:transparent;color:var(--mute);border-radius:8px}.ib:hover{background:#eef2f9}
input,textarea,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fff}
input:focus,textarea:focus,select:focus{border-color:var(--b);outline:0;box-shadow:0 0 0 3px #2563eb22}
:focus-visible{outline:2px solid var(--b);outline-offset:2px}
label{display:block;margin:16px 0 6px;font-weight:600;font-size:13px}
.req{color:var(--red)}
h1,h2,h3{margin:0}.ph{font-size:28px;font-weight:500;letter-spacing:-.03em}.sub{color:var(--mute);margin:4px 0 20px}
.err{color:var(--red);min-height:20px;margin-top:8px;font-size:13px}
/* login: minimal */
#login{min-height:100vh;display:grid;place-items:center;padding:32px;background:#fafbfd}
.lm{width:min(360px,100%);animation:rise .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
.lw{text-align:center;margin-bottom:56px;line-height:1}
.lw b{display:block;font-size:40px;font-weight:300;letter-spacing:.42em;margin-right:-.42em;color:var(--ink)}
.lw small{display:block;margin-top:14px;font-size:11px;font-weight:500;letter-spacing:.6em;margin-right:-.6em;color:var(--mute)}
#lf label{transition:color .2s;margin:22px 0 0;font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
#lf label:has(+input:focus){color:var(--ink)}
#lf input{border:0;border-bottom:1px solid #d5dcea;border-radius:0;background:transparent;padding:10px 0;font-size:15px;transition:border-color .2s}
#lf input:focus{box-shadow:none;border-color:var(--ink)}
#lf input:-webkit-autofill{-webkit-text-fill-color:var(--ink);-webkit-box-shadow:0 0 0 1000px #fafbfd inset}
#lf .bt.p{width:100%;margin-top:14px;padding:13px;border-radius:6px;background:var(--ink);border-color:var(--ink);font-weight:500;letter-spacing:.06em}
#lf .bt.p:hover{background:var(--b);border-color:var(--b)}
/* shell */
#app{display:flex;min-height:100vh}
#app:not(.hide){animation:appin .5s ease-out}
@keyframes appin{from{opacity:0}}
.sb{width:232px;flex:none;background:#fff;color:#5b6578;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:22px 14px;border-right:1px solid var(--line)}
.brand{padding:6px 12px 34px;color:var(--ink);line-height:1}
.brand b{display:block;font-size:22px;font-weight:300;letter-spacing:.42em}
.brand small{display:block;margin-top:7px;font-size:9.5px;font-weight:600;letter-spacing:.6em;color:var(--mute)}
.nv{display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px;border:0;background:transparent;color:#5b6578;border-radius:8px;margin-bottom:4px;text-align:left;font-weight:500}
.nv:hover{background:#f1f4fa}.nv.on{background:var(--ink);color:#fff}
.sbu{display:flex;align-items:center;gap:10px;padding:14px 8px 0;border-top:1px solid var(--line);margin-top:10px;color:var(--ink)}
.sbu small{display:block;color:var(--mute)}
.av{width:36px;height:36px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:600;font-size:13px;flex:none}
.ws{flex:1;min-width:0}
.tb{display:flex;align-items:center;gap:14px;padding:12px 30px;background:rgba(250,251,253,.88);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.sw{position:relative;flex:1;max-width:420px}.sw .i{position:absolute;left:12px;top:10px;color:var(--mute)}.sw input{padding-left:38px;background:var(--bg)}
.mlogo{display:none;flex-direction:column;line-height:1;color:var(--ink)}
.mlogo b{font-size:16px;font-weight:300;letter-spacing:.34em}
.mlogo small{margin-top:4px;font-size:8px;font-weight:600;letter-spacing:.46em;color:var(--mute)}
.bw{position:relative}.bdg{position:absolute;top:-2px;right:-2px;background:var(--red);color:#fff;font-size:10px;min-width:16px;height:16px;border-radius:8px;display:grid;place-items:center;padding:0 4px;pointer-events:none}
#uw{position:relative}#ub{display:flex;align-items:center;gap:10px;border:0;background:transparent;padding:4px 6px;border-radius:8px;font-weight:600}
#ub:hover{background:#eef2f9}#ub .av{width:32px;height:32px;background:var(--ink)}
#um{position:absolute;right:0;top:46px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 40px #1a2a5026;min-width:190px;padding:6px;z-index:9}
#um button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;padding:9px 12px;border-radius:7px;text-align:left}#um button:hover{background:#eef2f9}
#view{padding:28px 30px 40px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;border-color:#e9edf5}
.card h2{font-size:16px;font-weight:600}.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
a[data-go]{color:var(--b);font-weight:500;cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
.sc{display:flex;gap:14px;align-items:center}.sc .ico{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none}
.sc b{display:block;font-size:26px;line-height:1.1;font-weight:600}.sc span{font-size:13px;color:var(--mute)}.sc em{display:block;font-style:normal;font-size:12px;color:var(--mute)}
.ico.b,.ico.g,.ico.o,.ico.p{background:#f1f4fa;color:var(--ink)}
.g2{display:grid;grid-template-columns:1fr 330px;gap:20px;align-items:start}.side{display:grid;gap:20px}
.help{background:#fff;display:flex;gap:14px;align-items:center}.help .ico{width:56px;height:56px;border-radius:14px;background:#f1f4fa;color:var(--ink);display:grid;place-items:center;flex:none}
.help p{margin:2px 0 10px;color:var(--mute);font-size:13px}
.qa{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:10px;padding:12px 14px;margin-top:10px}
.qa:hover{background:#f6f9ff}.qa.p{background:var(--ink);border-color:var(--ink);color:#fff}.qa small{display:block;color:var(--mute)}.qa.p small{color:#b8c0d2}
.qa .ico{width:36px;height:36px;border-radius:50%;background:#f1f4fa;color:var(--ink);display:grid;place-items:center;flex:none}.qa.p .ico{background:#ffffff30;color:#fff}
.tbl{overflow:hidden;border:1px solid var(--line);border-radius:10px;background:#fff;border-color:#e9edf5}
.r{display:grid;gap:14px;align-items:center;padding:13px 18px;border-bottom:1px solid var(--line)}
.r:last-child{border-bottom:0}.r.h{background:transparent;color:var(--mute);font-size:11px;font-weight:600;padding:10px 18px;text-transform:uppercase;letter-spacing:.08em}
.c5{grid-template-columns:90px 1.8fr 120px 100px 150px}.c7{grid-template-columns:90px 1.8fr 120px 100px 140px 110px 80px}
.r.d{cursor:pointer}.r.d:hover{background:#f6f9ff}.r .t{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.id{color:var(--mute);font-weight:500}.dt,.own{color:var(--mute)}.em{padding:44px;text-align:center;color:var(--mute)}
.st,.pr{display:inline-block;padding:2px 12px;border-radius:99px;font-size:12px;font-weight:600;width:max-content}
.st.o{background:#dfeaff;color:#2563eb}.st.p{background:#fff0d2;color:#c27a00}.st.d{background:#d9f5e5;color:#16884a}
.pr.h{background:#ffe0e0;color:#d1333a}.pr.m{background:#fff0d2;color:#c27a00}.pr.l{background:#eceff5;color:#5b6578}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.tab{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 16px;font-weight:500}.tab.on{background:var(--ink);border-color:var(--ink);color:#fff}
.tabs select{width:auto;margin-left:auto}
.pg{display:flex;justify-content:flex-end;align-items:center;gap:10px;margin-top:14px;color:var(--mute)}
.fm{max-width:760px}.row2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.cc{text-align:right;color:var(--mute);font-size:12px}
.dz{border:1.5px dashed #b9c6e2;border-radius:10px;padding:22px;text-align:center;color:var(--mute);cursor:pointer;background:#fafcff}
.dz:hover,.dz.over{border-color:var(--b);background:var(--bl)}.dz b{color:var(--ink)}
.fl{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.fl:empty{display:none}
.fc{background:var(--bl);color:var(--b2);border-radius:99px;padding:3px 6px 3px 12px;font-size:12.5px}.fc i{cursor:pointer;font-style:normal;padding:0 6px;font-size:15px}
.ac{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
.back{display:inline-block;margin-bottom:14px;color:var(--b);font-weight:500;cursor:pointer}
.dh{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:20px;flex-wrap:wrap}
.tn{color:var(--mute);font-weight:600}.meta{display:flex;gap:12px;align-items:center;color:var(--mute);margin-top:6px;flex-wrap:wrap}.da{display:flex;gap:10px;align-items:center}
.g3{display:grid;grid-template-columns:1fr 320px;gap:20px;align-items:start}
.msg{display:flex;gap:12px;margin-bottom:18px}.mb{flex:1;background:#f7f9fd;border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0}
.mb.sup{background:#fff}.av.sup{background:#5b6578}.mh{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.mh small{color:var(--mute)}
.mt{white-space:pre-wrap;margin-top:6px;overflow-wrap:anywhere}
.rb{border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:6px}.rb textarea{border:0;padding:4px;resize:vertical}.rb textarea:focus{box-shadow:none}
.ra{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.dl{display:grid;grid-template-columns:110px 1fr;gap:10px 8px;margin-top:12px;font-size:13.5px}.dl dt{color:var(--mute)}.dl dd{margin:0}
.af{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin-top:8px;color:var(--ink);text-decoration:none}
.af:hover{background:#f6f9ff}.af small{color:var(--mute);margin-left:auto}
.kb{display:grid;grid-template-columns:230px 1fr;gap:20px;align-items:start}
.kc button{display:flex;justify-content:space-between;width:100%;border:0;background:transparent;padding:10px 12px;border-radius:8px;text-align:left}
.kc button.on{background:var(--ink);color:#fff}.kc button:hover:not(.on){background:#eef2f9}
.ka{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:16px;margin-bottom:12px}
.ka:hover{background:#f6f9ff}.ka .ico{width:44px;height:44px;border-radius:10px;background:#f1f4fa;color:var(--ink);display:grid;place-items:center;flex:none}
.ka small{color:var(--mute)}.tag{background:var(--bl);color:var(--b2);border-radius:5px;padding:1px 8px;font-size:12px;margin-right:8px}
.art ol,.art ul{padding-left:20px}.art li{margin:6px 0}
/* modal */
.ov{position:fixed;inset:0;z-index:20;background:#0a1530a0;display:grid;place-items:center;padding:16px}
.pn{position:relative;background:#fff;border-radius:14px;width:min(480px,100%);max-height:90vh;overflow:auto;padding:28px;animation:in .2s ease-out}
.pn h3{font-size:20px;margin:0 30px 6px 0}
@keyframes in{from{transform:translateY(12px);opacity:0}}
.x{position:absolute;top:12px;right:12px;width:34px;height:34px;border:0;background:transparent;font-size:24px;color:var(--mute)}
.qb{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;width:max-content;margin:16px auto}
.nl{display:flex;gap:12px;align-items:center;padding:10px;border-radius:8px;cursor:pointer}.nl:hover{background:#f6f9ff}.nl small{color:var(--mute);margin-left:auto;white-space:nowrap}
#toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);z-index:40;background:var(--navy);color:#fff;padding:10px 20px;border-radius:8px;font-weight:500;box-shadow:0 10px 40px #0005;max-width:90vw}
/* chat */
#bf{position:fixed;right:24px;bottom:24px;z-index:15;width:56px;height:56px;border-radius:50%;padding:0;background:var(--ink);border:0;color:#fff;display:grid;place-items:center;box-shadow:0 10px 30px #0003}
#bp{position:fixed;right:24px;bottom:92px;z-index:15;width:min(370px,calc(100vw - 32px));height:min(500px,70vh);background:#fff;border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;box-shadow:0 20px 60px #1a2a5033;overflow:hidden}
.bh{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--ink);color:#fff}.bh button{border:0;background:transparent;color:#fff;font-size:22px}
#bm{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.bm{max-width:86%;padding:9px 12px;border-radius:12px 12px 12px 3px;background:#fff;border:1px solid var(--line);white-space:pre-wrap}
.bm.me{align-self:flex-end;border-radius:12px 12px 3px 12px;background:var(--ink);border-color:var(--ink);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:8px 14px;background:var(--bg)}.chips button{padding:4px 11px;font-size:12.5px;border-radius:99px;border:1px solid var(--line);background:#fff;color:var(--mute)}
#bform{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
.bn{display:none}
@media(max-width:1100px){.g2,.g3{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:800px){
 .sb{display:none}.mlogo{display:flex}.tb{padding:10px 14px}#ub span{display:none}#view{padding:18px 14px 100px}
 .bn{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:10;background:#fff;border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
 .bn button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:transparent;color:var(--mute);font-size:11px;padding:4px}.bn button.on{color:var(--ink)}
 .kb{grid-template-columns:1fr}.row2{grid-template-columns:1fr}
 .r{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}.r.h,.own,.act{display:none}.r .id,.r .t{width:100%}.r .t{white-space:normal}
 #bf{bottom:84px;right:16px}#bp{bottom:150px;right:16px}.tabs select{margin-left:0}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>

<section id="login"><div class="lm"><div class="lw"><b>HELIX</b><small>TICKETING</small></div>
<form id="lf"><label for="em">Email</label><input id="em" type="email" required autocomplete="username">
<label for="pw">Password</label><input id="pw" type="password" required autocomplete="current-password">
<div class="err" id="le"></div><button class="bt p">Sign in</button></form></div></section>

<div id="app" class="hide">
<aside class="sb"><div class="brand"><b>HELIX</b><small>TICKETING</small></div>
<button class="nv" data-v="dash" data-go="dash"></button><button class="nv" data-v="tix" data-go="tix"></button>
<button class="nv" data-v="new" data-go="new"></button><button class="nv" data-v="kb" data-go="kb"></button>
<button class="nv" id="sq"></button><div class="sp"></div>
<div class="sbu"><div class="av sa"></div><div><b class="sn"></b><small>Customer</small></div></div></aside>
<div class="ws">
<header class="tb"><div class="mlogo"><b>HELIX</b><small>TICKETING</small></div>
<div class="sw" id="sw"></div><div class="sp"></div>
<div class="bw"><button class="ib" id="bell" aria-label="Notifications"></button><span class="bdg hide" id="bb"></span></div>
<div id="uw"><button id="ub"><div class="av sa"></div><span class="sn"></span></button>
<div id="um" class="hide"><button id="um1"></button><button id="um2"></button></div></div></header>
<main id="view"></main></div>
<nav class="bn"><button data-v="dash" data-go="dash"></button><button data-v="tix" data-go="tix"></button><button data-v="new" data-go="new"></button><button data-v="kb" data-go="kb"></button></nav>
</div>

<button id="bf" class="hide" aria-label="Ask the Helix assistant"></button>
<div id="bp" class="hide"><div class="bh"><b>Helix assistant</b><button id="bx" aria-label="Close assistant">&times;</button></div><div id="bm"></div>
<div class="chips"><button data-q="How many tickets do I have?">How many tickets?</button><button data-q="Which tickets are in progress?">In progress</button><button data-q="Summarize my tickets">Summary</button></div>
<form id="bform"><input id="bi" placeholder="Ask about your tickets" autocomplete="off" aria-label="Message"><button class="bt p">Send</button></form></div>
<div id="m"></div><div id="toast" class="hide"></div>

<script>
const $=s=>document.querySelector(s);
const I={home:'<path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
plus:'<circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/>',book:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/>',
qr:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM20 14v1M14 20h1M18 20h3v-3"/>',
bell:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/>',out:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>',
search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',clip:'<path d="M21 12l-9 9a5 5 0 0 1-7-7l9-9a3 3 0 0 1 4 4l-9 9a1 1 0 0 1-2-2l8-8"/>',
up:'<path d="M16 16l-4-4-4 4M12 12v9"/><path d="M20 16.6A5 5 0 0 0 18 7h-1.3A8 8 0 1 0 4 15.3"/>',check:'<path d="M20 6L9 17l-5-5"/>',
clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',alert:'<circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/>',chev:'<path d="M6 9l6 6 6-6"/>',
head:'<path d="M3 14v-2a9 9 0 0 1 18 0v2"/><rect x="2" y="14" width="5" height="6" rx="2"/><rect x="17" y="14" width="5" height="6" rx="2"/>',
file:'<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/>',chat:'<path d="M21 12a8 8 0 0 1-11.5 7.2L4 21l1.8-5.5A8 8 0 1 1 21 12z"/>'};
const ic=(n,s=20)=>`<svg class="i" viewBox="0 0 24 24" width="${s}" height="${s}">${I[n]}</svg>`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ini=n=>String(n||'').split(/[\s@]+/).filter(Boolean).slice(0,2).map(x=>x[0].toUpperCase()).join('');
const grp=s=>s==='closed'||s==='merged'?'done':s==='new'?'open':'progress';
const GC={open:'o',progress:'p',done:'d'};
const SL=s=>s==='new'?'Open':s==='open'?'In Progress':s.startsWith('pending')?'Pending':'Resolved';
const stat=s=>`<span class="st ${GC[grp(s)]}">${SL(s)}</span>`;
const PN=p=>({low:'Low',normal:'Medium',high:'High'}[String(p).replace(/^\d\s*/,'').toLowerCase()]||'Medium');

function bindDrop(p,store){const z=$('#'+p+'z'),f=$('#'+p+'f'),l=$('#'+p+'l');
 const show=()=>{l.innerHTML=store.map((x,i)=>`<span class="fc">${esc(x.name)}<i data-rm="${i}" title="Remove">&times;</i></span>`).join('')};
 const add=async fs=>{for(const file of fs){if(store.length>=3){toast('You can attach up to 3 files');break}
  if(file.size>5*1048576){toast(file.name+' is over 5 MB');continue}
  const data=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(String(fr.result).split(',')[1]);fr.readAsDataURL(file)});
  store.push({name:file.name,type:file.type,data})}show()};
 z.onclick=()=>f.click();f.onchange=()=>{const a=[...f.files];f.value='';add(a)};
 z.ondragover=e=>{e.preventDefault();z.classList.add('over')};z.ondragleave=()=>z.classList.remove('over');
 z.ondrop=e=>{e.preventDefault();z.classList.remove('over');add([...e.dataTransfer.files])};
 l.onclick=e=>{const i=e.target.dataset.rm;if(i!==undefined){store.splice(+i,1);show()}};show()}
